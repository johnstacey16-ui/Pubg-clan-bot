name: Verify PUBG bot

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install endpoint dependencies for tests
        run: npm install --no-save --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript syntax
        run: find api lib assets scripts tests -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Test game-mode maths and account names
        run: node --test tests/*.test.js

  chromium-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install lightweight Chrome driver
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.57.0
      - name: Confirm hosted Google Chrome
        run: command -v google-chrome && google-chrome --version
      - name: Verify real Chrome at desktop and mobile viewports with synthetic data
        run: node tests/browser-smoke.js
