name: Verify PUBG bot

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install endpoint dependencies for tests
        run: npm install --no-save --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript syntax
        run: find api lib scripts tests -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Test game-mode maths and account names
        run: node --test tests/*.test.js
