name: Import pinned public HELP training toolkit

on:
  push:
    branches: [integrate-help-toolkit]
    paths:
      - '.github/workflows/vendor-help-toolkit.yml'
      - 'scripts/vendor-help-toolkit.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-training:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Import pinned public source into the new static training section
        run: bash scripts/vendor-help-toolkit.sh
      - name: Validate relocated assets and Command Centre navigation
        run: |
          node scripts/check-training-integration.cjs
          node --test tests/training-integration.test.js
      - name: Commit validated snapshot to integration branch only
        run: |
          test "$GITHUB_REF_NAME" = "integrate-help-toolkit"
          git add -A training/
          if git diff --cached --quiet; then
            echo "Pinned source already current"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Vendor full pinned HELP PUBG training toolkit'
          git push origin HEAD:integrate-help-toolkit
