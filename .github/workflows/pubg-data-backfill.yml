name: Collect missing PUBG clan data

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'

permissions:
  contents: read

jobs:
  pubg-backfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Fill missing data using the shared API limit
        env:
          PUBG_SYNC_CRON_SECRET: ${{ secrets.PUBG_SYNC_CRON_SECRET }}
          PUBG_BACKFILL_CYCLES: '20'
        run: node scripts/collect-pubg-backfill.js
